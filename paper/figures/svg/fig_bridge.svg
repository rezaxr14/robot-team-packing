<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="674" viewBox="0 0 1000 674"><rect width="1000" height="674" fill="#FFFFFF"/><text x="20" y="28" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">a</text><text x="40" y="28" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">Isaac scene, top view (layout constants, metres)</text><rect x="87.4" y="208.09999999999997" width="409.2" height="108.9" rx="8" fill="#F6F7F9" stroke="#8A94A0" stroke-width="1.5"/><line x1="235.9" y1="208.09999999999997" x2="235.9" y2="317.0" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="348.1" y1="208.09999999999997" x2="348.1" y2="317.0" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/><text x="179.8" y="309.0" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#666666">left</text><circle cx="179.8" cy="290.6" r="5" fill="#8A94A0"/><circle cx="179.8" cy="260.9" r="5" fill="#8A94A0"/><circle cx="179.8" cy="231.2" r="5" fill="#8A94A0"/><text x="292.0" y="309.0" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#666666">center</text><circle cx="292.0" cy="290.6" r="5" fill="#8A94A0"/><circle cx="292.0" cy="260.9" r="5" fill="#8A94A0"/><circle cx="292.0" cy="231.2" r="5" fill="#8A94A0"/><text x="404.2" y="309.0" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#666666">right</text><circle cx="404.2" cy="290.6" r="5" fill="#8A94A0"/><circle cx="404.2" cy="260.9" r="5" fill="#8A94A0"/><circle cx="404.2" cy="231.2" r="5" fill="#8A94A0"/><rect x="226.0" y="89.29999999999995" width="132.0" height="112.19999999999999" rx="8" fill="#FFFFFF" stroke="#17324A" stroke-width="2.2"/><rect x="226.0" y="165.19999999999993" width="132.0" height="36.3" rx="0" fill="#EAE5F0" stroke="#76519A" stroke-width="1.0"/><rect x="226.0" y="89.29999999999995" width="132.0" height="26.400000000000002" rx="0" fill="#F5E8DD" stroke="#BD641B" stroke-width="1.0"/><text x="292.0" y="146.45" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#17324A">main</text><text x="368.0" y="189.35000000000002" font-family="Helvetica" font-size="14" fill="#76519A">laptop slot (back)</text><text x="368.0" y="108.49999999999994" font-family="Helvetica" font-size="14" fill="#BD641B">front pocket</text><text x="216.0" y="151.40000000000003" font-family="Helvetica" font-size="14" text-anchor="end" fill="#17324A">bag 0.40 x 0.34 m</text><circle cx="140.2" cy="383.0" r="16" fill="#EBD0BB" stroke="#BD641B" stroke-width="2"/><text x="140.2" y="389.0" font-family="Helvetica" font-size="15" font-weight="bold" text-anchor="middle" fill="#BD641B">L</text><circle cx="443.8" cy="383.0" r="16" fill="#EBD0BB" stroke="#BD641B" stroke-width="2"/><text x="443.8" y="389.0" font-family="Helvetica" font-size="15" font-weight="bold" text-anchor="middle" fill="#BD641B">R</text><!--free:vector--><polyline points="62.5,517.5 266.6,249.6" fill="none" stroke="#087F83" stroke-width="1.6" stroke-dasharray="6 5"/><polygon points="272.0,242.5 269.9,252.1 263.3,247.1" fill="#087F83" stroke="none"/><rect x="26.5" y="517.5" width="36" height="28" rx="5" fill="#B5D9DA" stroke="#087F83" stroke-width="2"/><text x="44.5" y="537.5" font-family="Helvetica" font-size="15" font-weight="bold" text-anchor="middle" fill="#087F83">A</text><!--free:vector--><polyline points="521.5,517.5 317.4,249.6" fill="none" stroke="#087F83" stroke-width="1.6" stroke-dasharray="6 5"/><polygon points="312.0,242.5 320.7,247.1 314.1,252.1" fill="#087F83" stroke="none"/><rect x="521.5" y="517.5" width="36" height="28" rx="5" fill="#B5D9DA" stroke="#087F83" stroke-width="2"/><text x="539.5" y="537.5" font-family="Helvetica" font-size="15" font-weight="bold" text-anchor="middle" fill="#087F83">B</text><text x="292.0" y="540.8" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#087F83">Eyes: z = 0.75 m, looking at the table centre</text><text x="620" y="28" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">b</text><text x="640" y="28" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">One success definition, three worlds</text><rect x="620" y="48" width="360" height="104" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4"/><text x="630" y="72.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#337857">Symbolic world</text><text x="630" y="97.1" font-family="Helvetica" font-size="14.5" fill="#444444">Fast; the loop is developed and tested here.</text><rect x="620" y="166" width="360" height="104" rx="8" fill="#EAF0F6" stroke="#2865A7" stroke-width="1.4"/><text x="630" y="190.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#2865A7">Pose-level fake simulator</text><text x="630" y="215.1" font-family="Helvetica" font-size="14.5" fill="#444444">Poses in; a bridge maps them to regions and</text><text x="630" y="233.7" font-family="Helvetica" font-size="14.5" fill="#444444">compartments. Loop outcomes match the symbolic</text><text x="630" y="252.3" font-family="Helvetica" font-size="14.5" fill="#444444">world in tests.</text><rect x="620" y="284" width="360" height="104" rx="8" fill="#F8F0E8" stroke="#BD641B" stroke-width="1.4"/><text x="630" y="308.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#BD641B">Isaac Lab</text><text x="630" y="333.1" font-family="Helvetica" font-size="14.5" fill="#444444">Physics. Skill outcomes are derived from the state</text><text x="630" y="351.7" font-family="Helvetica" font-size="14.5" fill="#444444">before and after each skill.</text><rect x="850" y="292" width="118" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="909.0" y="307.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">render pending</text><rect x="620" y="416" width="360" height="104" rx="8" fill="#E8EAED" stroke="#17324A" stroke-width="1.4"/><text x="630" y="440.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#17324A">rules.check_final</text><text x="630" y="465.1" font-family="Helvetica" font-size="14.5" fill="#444444">Every requested item packed, zero rule violations,</text><text x="630" y="483.7" font-family="Helvetica" font-size="14.5" fill="#444444">nothing crushed. One function scores all three</text><text x="630" y="502.3" font-family="Helvetica" font-size="14.5" fill="#444444">worlds.</text><text x="620" y="546" font-family="Helvetica" font-size="14" font-weight="bold" fill="#666666">Ten skill outcomes derived from state:</text><text x="620" y="566" font-family="Helvetica" font-size="14" fill="#444444">success, slip, crush, out_of_reach, wrong_slot, no_space,</text><text x="620" y="584" font-family="Helvetica" font-size="14" fill="#444444">locked, overload, not_holding, hand_full</text><text x="620" y="620" font-family="Helvetica" font-size="14" fill="#666666">Quaternion order: wxyz (Isaac Lab 2.x), xyzw (3.0).</text><text x="620" y="640" font-family="Helvetica" font-size="14" fill="#666666">The identical-outcome test validates the integration,</text><text x="620" y="658" font-family="Helvetica" font-size="14" fill="#666666">not the physics.</text></svg>