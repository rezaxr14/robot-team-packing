<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="580" viewBox="0 0 1000 580"><rect width="1000" height="580" fill="#FFFFFF"/><text x="20" y="26" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">a</text><text x="40" y="26" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">19 markdown files</text><rect x="20" y="44" width="300" height="95.6" rx="8" fill="#EAF0F6" stroke="#2865A7" stroke-width="1.4"/><text x="30" y="65.9" font-family="Helvetica" font-size="14" font-weight="bold" fill="#2865A7">rule (6)</text><text x="30" y="87.8" font-family="Helvetica" font-size="14.5" fill="#444444">bag_exclusive, bottle_upright,</text><text x="30" y="106.4" font-family="Helvetica" font-size="14.5" fill="#444444">heavy_bottom, laptop_slot,</text><text x="30" y="124.9" font-family="Helvetica" font-size="14.5" fill="#444444">leave_distractors, lunchbox_last</text><rect x="20" y="147.6" width="300" height="58.480000000000004" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4"/><text x="30" y="169.5" font-family="Helvetica" font-size="14" font-weight="bold" fill="#337857">skill (4)</text><text x="30" y="191.4" font-family="Helvetica" font-size="14.5" fill="#444444">grasp, handover, place, push_aside</text><rect x="20" y="214.07999999999998" width="300" height="77.03999999999999" rx="8" fill="#E6F2F3" stroke="#087F83" stroke-width="1.4"/><text x="30" y="236.0" font-family="Helvetica" font-size="14" font-weight="bold" fill="#087F83">object (4)</text><text x="30" y="257.9" font-family="Helvetica" font-size="14.5" fill="#444444">obj_book, obj_bottle, obj_laptop,</text><text x="30" y="276.5" font-family="Helvetica" font-size="14.5" fill="#444444">obj_lunchbox</text><rect x="20" y="299.12" width="300" height="58.480000000000004" rx="8" fill="#F1EEF5" stroke="#76519A" stroke-width="1.4"/><text x="30" y="321.0" font-family="Helvetica" font-size="14" font-weight="bold" fill="#76519A">agent (3)</text><text x="30" y="342.9" font-family="Helvetica" font-size="14.5" fill="#444444">arm_L, arm_R, eye</text><rect x="20" y="365.6" width="300" height="58.480000000000004" rx="8" fill="#F8F0E8" stroke="#BD641B" stroke-width="1.4"/><text x="30" y="387.5" font-family="Helvetica" font-size="14" font-weight="bold" fill="#BD641B">memory (1)</text><text x="30" y="409.4" font-family="Helvetica" font-size="14.5" fill="#444444">episodes</text><rect x="20" y="432.08000000000004" width="300" height="58.480000000000004" rx="8" fill="#EDEEEF" stroke="#4A5560" stroke-width="1.4"/><text x="30" y="454.0" font-family="Helvetica" font-size="14" font-weight="bold" fill="#4A5560">task (1)</text><text x="30" y="475.9" font-family="Helvetica" font-size="14.5" fill="#444444">pack_backpack</text><text x="345" y="26" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">b</text><text x="365" y="26" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">Two-pass BM25 retrieval</text><rect x="345" y="44" width="300" height="98.80000000000001" rx="8" fill="#EAF0F6" stroke="#2865A7" stroke-width="1.4"/><text x="355" y="68.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#2865A7">Pass 1: rules</text><text x="355" y="93.1" font-family="Helvetica" font-size="14.5" fill="#444444">Query = the instruction. Top k=5 of 6 rules.</text><text x="355" y="111.7" font-family="Helvetica" font-size="14.5" fill="#444444">Instruction-required rules retrieved: 5 of 5</text><text x="355" y="130.3" font-family="Helvetica" font-size="14.5" fill="#444444">in this episode.</text><rect x="345" y="168.8" width="300" height="80.24000000000001" rx="8" fill="#E6F2F3" stroke="#087F83" stroke-width="1.4"/><text x="355" y="192.8" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#087F83">Pass 2: notes</text><text x="355" y="217.9" font-family="Helvetica" font-size="14.5" fill="#444444">Query = classes in the scene. Top k=3</text><text x="355" y="236.5" font-family="Helvetica" font-size="14.5" fill="#444444">object, skill and memory notes.</text><rect x="345" y="275.04" width="300" height="61.68000000000001" rx="8" fill="#F1EEF5" stroke="#76519A" stroke-width="1.4"/><text x="355" y="299.1" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#76519A">Brain context</text><text x="355" y="324.2" font-family="Helvetica" font-size="14.5" fill="#444444">Instruction + retrieved text + messages.</text><polyline points="495.0,142.8 495.0,160.4" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="495.0,168.8 491.1,160.4 498.9,160.4" fill="#666666" stroke="none"/><polyline points="495.0,249.0 495.0,266.6" fill="none" stroke="#666666" stroke-width="1.5"/><polygon points="495.0,275.0 491.1,266.6 498.9,266.6" fill="#666666" stroke="none"/><rect x="345" y="360.72" width="300" height="98.80000000000001" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4" stroke-dasharray="6 4"/><text x="355" y="384.7" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#337857">Monitor write-back</text><text x="355" y="409.9" font-family="Helvetica" font-size="14.5" fill="#444444">After episodes, measured success rates</text><text x="355" y="428.4" font-family="Helvetica" font-size="14.5" fill="#444444">and failure causes are written back into the</text><text x="355" y="447.0" font-family="Helvetica" font-size="14.5" fill="#444444">skill files.</text><text x="670" y="26" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">c</text><text x="690" y="26" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">The lunchbox tokenizer fix</text><text x="670" y="52" font-family="Helvetica" font-size="14.5" fill="#444444">Tokens of  "lunchbox1 last":</text><text x="670" y="72" font-family="Courier" font-size="14.5" fill="#B5383C">before: lunchbox1 | last</text><text x="670" y="92" font-family="Courier" font-size="14.5" fill="#337857">after:  lunchbox | 1 | last</text><text x="670" y="118" font-family="Helvetica" font-size="14.5" fill="#444444">BM25 score of each rule for this instruction:</text><text x="670" y="142" font-family="Helvetica" font-size="14.5" fill="#444444">bottle_upright</text><rect x="670" y="147" width="233.40565368385674" height="9" rx="2" fill="#D3888A" stroke="none" stroke-width="0"/><rect x="670" y="158" width="290.0" height="9" rx="2" fill="#669A81" stroke="none" stroke-width="0"/><text x="670" y="187" font-family="Helvetica" font-size="14.5" fill="#444444">laptop_slot</text><rect x="670" y="192" width="166.57754210388737" height="9" rx="2" fill="#D3888A" stroke="none" stroke-width="0"/><rect x="670" y="203" width="194.26826991299154" height="9" rx="2" fill="#669A81" stroke="none" stroke-width="0"/><text x="670" y="232" font-family="Helvetica" font-size="14.5" fill="#444444">leave_distractors</text><rect x="670" y="237" width="182.00941035886328" height="9" rx="2" fill="#D3888A" stroke="none" stroke-width="0"/><rect x="670" y="248" width="182.00941035886328" height="9" rx="2" fill="#669A81" stroke="none" stroke-width="0"/><text x="670" y="277" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#17324A">lunchbox_last</text><rect x="670" y="282" width="66.43825385563314" height="9" rx="2" fill="#D3888A" stroke="none" stroke-width="0"/><rect x="670" y="293" width="145.92591209529854" height="9" rx="2" fill="#669A81" stroke="none" stroke-width="0"/><text x="821.9259120952986" y="300" font-family="Helvetica" font-size="14.5" fill="#666666">6.1 / 13.5</text><text x="670" y="322" font-family="Helvetica" font-size="14.5" fill="#444444">heavy_bottom</text><rect x="670" y="327" width="107.61156129803204" height="9" rx="2" fill="#D3888A" stroke="none" stroke-width="0"/><rect x="670" y="338" width="107.61156129803204" height="9" rx="2" fill="#669A81" stroke="none" stroke-width="0"/><text x="670" y="367" font-family="Helvetica" font-size="14.5" fill="#444444">bag_exclusive</text><rect x="670" y="372" width="57.88304268269913" height="9" rx="2" fill="#D3888A" stroke="none" stroke-width="0"/><rect x="670" y="383" width="57.88304268269913" height="9" rx="2" fill="#669A81" stroke="none" stroke-width="0"/><rect x="670" y="404" width="12" height="10" rx="2" fill="#D3888A" stroke="none" stroke-width="0"/><text x="688" y="413" font-family="Helvetica" font-size="14.5" fill="#444444">before</text><rect x="750" y="404" width="12" height="10" rx="2" fill="#669A81" stroke="none" stroke-width="0"/><text x="768" y="413" font-family="Helvetica" font-size="14.5" fill="#444444">after</text><text x="670" y="438" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#444444">lunchbox_last: rank 5 -&gt; 4 of 6.</text><text x="20" y="544" font-family="Helvetica" font-size="14.5" fill="#666666">The pre-fix tokenizer is our reconstruction (alphanumeric runs, so lunchbox1 stays one token). At k=5 both retrieve all required rules for this</text><text x="20" y="562" font-family="Helvetica" font-size="14.5" fill="#666666">episode; the fix widens the margin over the next rule (5.3). The earlier dropped-rule case reported by the authors is not reproduced here.</text></svg>