font-size="14.5" fill="#666666">reason, task</text><rect x="20" y="148" width="182" height="92" rx="8" fill="#F8F9F9" stroke="#8A94A0" stroke-width="1.0"/><text x="30" y="171" font-family="Helvetica" font-size="16" font-weight="bold" fill="#4A5560">STATUS</text><text x="30" y="192" font-family="Helvetica" font-size="14.5" fill="#666666">progress, task</text><rect x="214" y="148" width="182" height="92" rx="8" fill="#F8F9F9" stroke="#8A94A0" stroke-width="1.0"/><text x="224" y="171" font-family="Helvetica" font-size="16" font-weight="bold" fill="#4A5560">BLOCKED</text><text x="224" y="192" font-family="Helvetica" font-size="14.5" fill="#666666">reason, task</text><rect x="408" y="148" width="182" height="92" rx="8" fill="#F8F0E8" stroke="#BD641B" stroke-width="1.5"/><text x="418" y="171" font-family="Helvetica" font-size="16" font-weight="bold" fill="#BD641B">TOUCH</text><text x="418" y="192" font-family="Helvetica" font-size="14.5" fill="#444444">grasp_ok,</text><text x="418" y="210" font-family="Helvetica" font-size="14.5" fill="#444444">measured_weight, obj,</text><text x="418" y="228" font-family="Helvetica" font-size="14.5" fill="#444444">peak_force, slip</text><rect x="602" y="148" width="182" height="92" rx="8" fill="#F1EEF5" stroke="#76519A" stroke-width="1.5"/><text x="612" y="171" font-family="Helvetica" font-size="16" font-weight="bold" fill="#76519A">LOOK</text><text x="612" y="192" font-family="Helvetica" font-size="14.5" fill="#444444">query</text><rect x="796" y="148" width="182" height="92" rx="8" fill="#F8F0E8" stroke="#BD641B" stroke-width="1.5"/><text x="806" y="171" font-family="Helvetica" font-size="16" font-weight="bold" fill="#BD641B">CHALLENGE</text><text x="806" y="192" font-family="Helvetica" font-size="14.5" fill="#444444">evidence, obj</text><rect x="20" y="250" width="182" height="92" rx="8" fill="#F8F9F9" stroke="#8A94A0" stroke-width="1.0"/><text x="30" y="273" font-family="Helvetica" font-size="16" font-weight="bold" fill="#4A5560">HANDOVER</text><text x="30" y="294" font-family="Helvetica" font-size="14.5" fill="#666666">obj, phase</text><rect x="214" y="250" width="182" height="92" rx="8" fill="#F8F9F9" stroke="#8A94A0" stroke-width="1.0"/><text x="224" y="273" font-family="Helvetica" font-size="16" font-weight="bold" fill="#4A5560">LOCK</text><text x="224" y="294" font-family="Helvetica" font-size="14.5" fill="#666666">action, zone</text><rect x="408" y="250" width="182" height="92" rx="8" fill="#EDEEEF" stroke="#4A5560" stroke-width="1.5"/><text x="418" y="273" font-family="Helvetica" font-size="16" font-weight="bold" fill="#4A5560">AMEND</text><text x="418" y="294" font-family="Helvetica" font-size="14.5" fill="#444444">text</text><text x="20" y="370" font-family="Helvetica" font-size="14" fill="#666666">Colour = sender in the recorded episodes: Eye teal, Arm orange, Brain purple, human dark grey. Light grey: not exchanged in them.</text><text x="20" y="406" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">b</text><text x="40" y="406" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">A real CHALLENGE (recorded, seed 24)</text><rect x="20" y="420" width="470" height="110" rx="8" fill="#F6F7F9" stroke="#999999" stroke-width="1.1"/><text x="32" y="444" font-family="Courier" font-size="13.5" fill="#444444">{"type": "CHALLENGE", "sender": "arm_L", "receiver":</text><text x="32" y="462" font-family="Courier" font-size="13.5" fill="#444444">"brain", "content": {"obj": "book2", "evidence":</text><text x="32" y="480" font-family="Courier" font-size="13.5" fill="#444444">{"measured_weight": 1.283, "reported": 2.136}}}</text><text x="32" y="504" font-family="Helvetica" font-size="14" fill="#666666">token proxy: 42 (about 4 characters per token)</text><rect x="20" y="546" width="470" height="80.24000000000001" rx="8" fill="#E8EAED" stroke="#17324A" stroke-width="1.4"/><text x="30" y="570.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#17324A">Bus</text><text x="30" y="595.1" font-family="Helvetica" font-size="14.5" fill="#444444">Validates the schema, charges tokens against a per-episode budget,</text><text x="30" y="613.7" font-family="Helvetica" font-size="14.5" fill="#444444">and refuses an over-budget message while telling the sender.</text><text x="520" y="406" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">c</text><text x="540" y="406" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">Four communication modes</text><text x="520" y="450" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">push</text><text x="520" y="470" font-family="Helvetica" font-size="14" fill="#666666">full scene every round</text><rect x="715" y="438" width="250.0" height="26" rx="3" fill="#739BC6" stroke="#2865A7" stroke-width="1.0"/><text x="957.0" y="457" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="end" fill="#FFFFFF">10,551</text><text x="520" y="508" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">delta</text><text x="520" y="528" font-family="Helvetica" font-size="14" fill="#666666">changed objects only</text><rect x="715" y="496" width="135.93539703903096" height="26" rx="3" fill="#739BC6" stroke="#2865A7" stroke-width="1.0"/><text x="842.9353970390309" y="515" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="end" fill="#FFFFFF">5,737</text><text x="520" y="566" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">pull</text><text x="520" y="586" font-family="Helvetica" font-size="14" fill="#666666">on request and after failures</text><rect x="715" y="554" width="44.89851288078403" height="26" rx="3" fill="#739BC6" stroke="#2865A7" stroke-width="1.0"/><text x="767.898512880784" y="573" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#444444">1,895</text><text x="520" y="624" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">init-only</text><text x="520" y="644" font-family="Helvetica" font-size="14" fill="#666666">once at the start</text><rect x="715" y="612" width="28.01203249104316" height="26" rx="3" fill="#739BC6" stroke="#2865A7" stroke-width="1.0"/><text x="751.0120324910431" y="631" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#444444">1,182</text><rect x="520" y="674" width="76.031" height="22.5" rx="4" fill="#F7ECE4" stroke="#BD641B" stroke-width="1.1"/><text x="558.0155" y="689.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#BD641B">FIXTURE</text><text x="612" y="691" font-family="Helvetica" font-size="14" fill="#666666">tokens per episode; symbolic world, noisy Eyes, 80 seeds</text><text x="520" y="722" font-family="Helvetica" font-size="14" fill="#666666">Success: push 73/80, delta 73/80, pull 72/80, init-only 71/80.</text><text x="520" y="742" font-family="Helvetica" font-size="14" fill="#666666">Checks the accounting only; says nothing about trained agents.</text></svg>