<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#FFFFFF"/><text x="20" y="26" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">a</text><text x="40" y="26" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">Upstream L2 scorer (read from the code)</text><rect x="20" y="44" width="440" height="58.480000000000004" rx="8" fill="#EDEEEF" stroke="#4A5560" stroke-width="1.4"/><text x="30" y="65.9" font-family="Helvetica" font-size="14" font-weight="bold" fill="#4A5560">Plan</text><text x="30" y="87.8" font-family="Helvetica" font-size="14.5" fill="#444444">model output</text><rect x="20" y="118.48" width="440" height="58.480000000000004" rx="8" fill="#EAF0F6" stroke="#2865A7" stroke-width="1.4"/><text x="30" y="140.4" font-family="Helvetica" font-size="14" font-weight="bold" fill="#2865A7">Feasibility check</text><text x="30" y="162.3" font-family="Helvetica" font-size="14.5" fill="#444444">pure Python, no simulator</text><polyline points="240.0,102.5 240.0,111.8" fill="none" stroke="#666666" stroke-width="1.2"/><polygon points="240.0,118.5 236.9,111.8 243.1,111.8" fill="#666666" stroke="none"/><rect x="20" y="192.96" width="440" height="58.480000000000004" rx="8" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.4"/><text x="30" y="214.9" font-family="Helvetica" font-size="14" font-weight="bold" fill="#B5383C">random.choice</text><text x="30" y="236.8" font-family="Helvetica" font-size="14.5" fill="#444444">over each asset's candidate start positions, drawn on every call</text><polyline points="240.0,177.0 240.0,186.2" fill="none" stroke="#666666" stroke-width="1.2"/><polygon points="240.0,193.0 236.9,186.2 243.1,186.2" fill="#666666" stroke="none"/><rect x="20" y="267.44" width="440" height="58.480000000000004" rx="8" fill="#EAF0F6" stroke="#2865A7" stroke-width="1.4"/><text x="30" y="289.3" font-family="Helvetica" font-size="14" font-weight="bold" fill="#2865A7">Correct if</text><text x="30" y="311.3" font-family="Helvetica" font-size="14.5" fill="#444444">feasible AND len(reference) / len(plan) &gt;= 0.99</text><polyline points="240.0,251.4 240.0,260.7" fill="none" stroke="#666666" stroke-width="1.2"/><polygon points="240.0,267.4 236.9,260.7 243.1,260.7" fill="#666666" stroke="none"/><rect x="20" y="341.92" width="440" height="58.480000000000004" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4"/><text x="30" y="363.8" font-family="Helvetica" font-size="14" font-weight="bold" fill="#337857">Reward</text><text x="30" y="385.7" font-family="Helvetica" font-size="14.5" fill="#444444">0.1 format + 0.9 correctness</text><polyline points="240.0,325.9 240.0,335.2" fill="none" stroke="#666666" stroke-width="1.2"/><polygon points="240.0,341.9 236.9,335.2 243.1,335.2" fill="#666666" stroke="none"/><rect x="20" y="418.40000000000003" width="440" height="77.03999999999999" rx="8" fill="#F8F0E8" stroke="#BD641B" stroke-width="1.4"/><text x="30" y="440.3" font-family="Helvetica" font-size="14" font-weight="bold" fill="#BD641B">Other upstream facts</text><text x="30" y="462.2" font-family="Helvetica" font-size="14.5" fill="#444444">Eval scripts read only the first 900 (L2) or 1000 (L1) rows. The L2</text><text x="30" y="480.8" font-family="Helvetica" font-size="14.5" fill="#444444">script loads id/val.json but writes to a directory named ood.</text><text x="500" y="26" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">b</text><text x="520" y="26" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">A toy case we built to test the idea</text><rect x="500" y="40" width="96.1715" height="22.5" rx="4" fill="#F7ECE4" stroke="#BD641B" stroke-width="1.1"/><text x="548.08575" y="55.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#BD641B">SYNTHETIC</text><text x="612" y="56" font-family="Helvetica" font-size="14.5" fill="#666666">not a statement about VIKI-R's published numbers</text><text x="500" y="108" font-family="Helvetica" font-size="14" font-weight="bold" fill="#17324A">plan valid only if the cup starts on the table</text><text x="500" y="126" font-family="Helvetica" font-size="14.5" fill="#666666">unseeded draws</text><rect x="500" y="136" width="400" height="24" rx="3" fill="#F1F3F5" stroke="#999999" stroke-width="0.8"/><rect x="500" y="136" width="180.0" height="24" rx="3" fill="#CB7476" stroke="#B5383C" stroke-width="1.0"/><text x="910" y="154" font-family="Helvetica" font-size="14" font-weight="bold" fill="#444444">18/40</text><text x="500" y="200" font-family="Helvetica" font-size="14" font-weight="bold" fill="#17324A">same plan, all start positions</text><text x="500" y="218" font-family="Helvetica" font-size="14.5" fill="#666666">exhaustive average</text><rect x="500" y="228" width="400" height="24" rx="3" fill="#F1F3F5" stroke="#999999" stroke-width="0.8"/><rect x="500" y="228" width="200.0" height="24" rx="3" fill="#CB7476" stroke="#B5383C" stroke-width="1.0"/><text x="910" y="246" font-family="Helvetica" font-size="14" font-weight="bold" fill="#444444">0.5</text><text x="500" y="292" font-family="Helvetica" font-size="14" font-weight="bold" fill="#17324A">position-agnostic plan</text><text x="500" y="310" font-family="Helvetica" font-size="14.5" fill="#666666">unseeded draws</text><rect x="500" y="320" width="400" height="24" rx="3" fill="#F1F3F5" stroke="#999999" stroke-width="0.8"/><rect x="500" y="320" width="400.0" height="24" rx="3" fill="#70A089" stroke="#337857" stroke-width="1.0"/><text x="910" y="338" font-family="Helvetica" font-size="14" font-weight="bold" fill="#444444">40/40</text><rect x="500" y="380" width="480" height="114.16" rx="8" fill="#E8EAED" stroke="#17324A" stroke-width="1.4"/><text x="510" y="401.9" font-family="Helvetica" font-size="14" font-weight="bold" fill="#17324A">What it means</text><text x="510" y="423.8" font-family="Helvetica" font-size="14.5" fill="#444444">When the checker draws the start position at random, a plan that is</text><text x="510" y="442.4" font-family="Helvetica" font-size="14.5" fill="#444444">only valid for some positions passes or fails by luck, and an unseeded</text><text x="510" y="460.9" font-family="Helvetica" font-size="14.5" fill="#444444">score moves between runs. Position-robust scoring (seeded or</text><text x="510" y="479.5" font-family="Helvetica" font-size="14.5" fill="#444444">exhaustive) removes that.</text><rect x="20" y="520" width="209.808" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="124.904" y="535.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">real items exposed: pending</text><text x="20" y="566" font-family="Helvetica" font-size="14.5" fill="#666666">How many real VIKI-Bench items depend on a random start position is unknown until the inventory script has been run on the dataset.</text></svg>