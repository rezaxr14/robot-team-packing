were wrong.</text><rect x="640" y="160.8" width="340" height="117.36" rx="8" fill="#E6F2F3" stroke="#087F83" stroke-width="1.4"/><text x="650" y="184.8" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#087F83">Charged to the Eye</text><text x="650" y="209.9" font-family="Helvetica" font-size="14.5" fill="#444444">The loop's attribution rules blame the Eye: the</text><text x="650" y="228.5" font-family="Helvetica" font-size="14.5" fill="#444444">mass it reported was far from the truth. A</text><text x="650" y="247.1" font-family="Helvetica" font-size="14.5" fill="#444444">heuristic label, not yet checked against hand</text><text x="650" y="265.6" font-family="Helvetica" font-size="14.5" fill="#444444">labels.</text><rect x="640" y="290.16" width="340" height="117.36" rx="8" fill="#F8F0E8" stroke="#BD641B" stroke-width="1.4"/><text x="650" y="314.2" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#BD641B">Fix 1: CHALLENGE</text><text x="650" y="339.3" font-family="Helvetica" font-size="14.5" fill="#444444">The Arm weighs what it grasps and disputes the</text><text x="650" y="357.9" font-family="Helvetica" font-size="14.5" fill="#444444">Eye (5 challenges here; measured vs reported</text><text x="650" y="376.4" font-family="Helvetica" font-size="14.5" fill="#444444">kg: book2 1.28 vs 2.14; book1 1.33 vs 0.50). The</text><text x="650" y="395.0" font-family="Helvetica" font-size="14.5" fill="#444444">scene is corrected and the rest replanned.</text><rect x="640" y="419.52000000000004" width="340" height="80.24000000000001" rx="8" fill="#EAF0F6" stroke="#2865A7" stroke-width="1.4"/><text x="650" y="443.5" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#2865A7">Fix 2: probe</text><text x="650" y="468.7" font-family="Helvetica" font-size="14.5" fill="#444444">Both Arms weigh every item before planning;</text><text x="650" y="487.2" font-family="Helvetica" font-size="14.5" fill="#444444">measurements override the Eye's mass guesses.</text><rect x="20" y="519.76" width="308" height="62" rx="8" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.4"/><text x="32" y="543.76" font-family="Helvetica" font-size="16" font-weight="bold" fill="#B5383C">no fix</text><text x="32" y="567.76" font-family="Helvetica" font-size="14.5" fill="#444444">score 0.85, failure, 12 rounds</text><rect x="216" y="533.76" width="100" height="14" rx="3" fill="#FFFFFF" stroke="#B5383C" stroke-width="1.0"/><rect x="216" y="533.76" width="85.0" height="14" rx="3" fill="#D3888A" stroke="none" stroke-width="0"/><rect x="342" y="519.76" width="308" height="62" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4"/><text x="354" y="543.76" font-family="Helvetica" font-size="16" font-weight="bold" fill="#337857">CHALLENGE</text><text x="354" y="567.76" font-family="Helvetica" font-size="14.5" fill="#444444">score 0.99, success, 15 rounds</text><rect x="538" y="533.76" width="100" height="14" rx="3" fill="#FFFFFF" stroke="#337857" stroke-width="1.0"/><rect x="538" y="533.76" width="99.0" height="14" rx="3" fill="#85AE9A" stroke="none" stroke-width="0"/><rect x="664" y="519.76" width="308" height="62" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4"/><text x="676" y="543.76" font-family="Helvetica" font-size="16" font-weight="bold" fill="#337857">probe</text><text x="676" y="567.76" font-family="Helvetica" font-size="14.5" fill="#444444">score 1.00, success, 17 rounds</text><rect x="860" y="533.76" width="100" height="14" rx="3" fill="#FFFFFF" stroke="#337857" stroke-width="1.0"/><rect x="860" y="533.76" width="100.0" height="14" rx="3" fill="#85AE9A" stroke="none" stroke-width="0"/><text x="20" y="609.76" font-family="Helvetica" font-size="14" fill="#666666">Recorded symbolic episode (seed 24, Eye mass noise sigma 0.45, scripted Brain): FIXTURE, a mechanism illustration, not a result.</text><text x="20" y="629.76" font-family="Helvetica" font-size="14" fill="#666666">Panels a and b show the scene the planner actually used; the challenge values are the Arms' own touch measurements.</text></svg>