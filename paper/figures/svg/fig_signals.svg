<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="777" viewBox="0 0 1000 777"><rect width="1000" height="777" fill="#FFFFFF"/><text x="20" y="28" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">From data to trained components</text><text x="20" y="56" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#666666">Training data or signal</text><text x="330" y="56" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#666666">Component</text><text x="620" y="56" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#666666">Method</text><rect x="20" y="66" width="270" height="100" rx="8" fill="#FFFFFF" stroke="#087F83" stroke-width="1.4"/><text x="30" y="90.0" font-family="Helvetica" font-size="15" fill="#444444">Rendered table images with SCENE</text><text x="30" y="109.2" font-family="Helvetica" font-size="15" fill="#444444">JSON targets</text><rect x="330" y="66" width="250" height="100" rx="8" fill="#E6F2F3" stroke="#087F83" stroke-width="1.4"/><text x="455.0" y="90.5" font-family="Helvetica" font-size="17" font-weight="bold" text-anchor="middle" fill="#087F83">Eye (VLM)</text><rect x="620" y="66" width="270" height="100" rx="8" fill="#FFFFFF" stroke="#087F83" stroke-width="1.4"/><text x="630" y="90.0" font-family="Helvetica" font-size="14.5" fill="#444444">LoRA fine-tuning, then rejection</text><text x="630" y="108.6" font-family="Helvetica" font-size="14.5" fill="#444444">sampling: K = 8 reports per image,</text><text x="630" y="127.1" font-family="Helvetica" font-size="14.5" fill="#444444">keep the best by field accuracy or by</text><text x="630" y="145.7" font-family="Helvetica" font-size="14.5" fill="#444444">counterfactual credit.</text><polyline points="290.0,116.0 318.8,116.0" fill="none" stroke="#087F83" stroke-width="2"/><polygon points="330.0,116.0 318.8,121.2 318.8,110.8" fill="#087F83" stroke="none"/><polyline points="580.0,116.0 608.8,116.0" fill="none" stroke="#087F83" stroke-width="2"/><polygon points="620.0,116.0 608.8,121.2 608.8,110.8" fill="#087F83" stroke="none"/><rect x="905" y="102" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="946.0" y="117.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><rect x="20" y="184" width="270" height="100" rx="8" fill="#FFFFFF" stroke="#76519A" stroke-width="1.4"/><text x="30" y="208.0" font-family="Helvetica" font-size="15" fill="#444444">Teacher plans validated by</text><text x="30" y="227.2" font-family="Helvetica" font-size="15" fill="#444444">closed-loop success</text><rect x="330" y="184" width="250" height="100" rx="8" fill="#F1EEF5" stroke="#76519A" stroke-width="1.4"/><text x="455.0" y="208.4" font-family="Helvetica" font-size="17" font-weight="bold" text-anchor="middle" fill="#76519A">Brain (text LLM)</text><rect x="620" y="184" width="270" height="100" rx="8" fill="#FFFFFF" stroke="#76519A" stroke-width="1.4"/><text x="630" y="208.0" font-family="Helvetica" font-size="14.5" fill="#444444">Supervised fine-tuning to learn the</text><text x="630" y="226.6" font-family="Helvetica" font-size="14.5" fill="#444444">format, then GRPO on the plan-level</text><text x="630" y="245.1" font-family="Helvetica" font-size="14.5" fill="#444444">reward below.</text><polyline points="290.0,234.0 318.8,234.0" fill="none" stroke="#76519A" stroke-width="2"/><polygon points="330.0,234.0 318.8,239.2 318.8,228.8" fill="#76519A" stroke="none"/><polyline points="580.0,234.0 608.8,234.0" fill="none" stroke="#76519A" stroke-width="2"/><polygon points="620.0,234.0 608.8,239.2 608.8,228.8" fill="#76519A" stroke="none"/><rect x="905" y="220" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="946.0" y="235.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><rect x="20" y="302" width="270" height="100" rx="8" fill="#FFFFFF" stroke="#BD641B" stroke-width="1.4"/><text x="30" y="326.0" font-family="Helvetica" font-size="15" fill="#444444">Scripted differential-IK</text><text x="30" y="345.2" font-family="Helvetica" font-size="15" fill="#444444">demonstrations</text><rect x="330" y="302" width="250" height="100" rx="8" fill="#F8F0E8" stroke="#BD641B" stroke-width="1.4"/><text x="455.0" y="326.4" font-family="Helvetica" font-size="17" font-weight="bold" text-anchor="middle" fill="#BD641B">Arms (blind policy)</text><rect x="620" y="302" width="270" height="100" rx="8" fill="#FFFFFF" stroke="#BD641B" stroke-width="1.4"/><text x="630" y="326.0" font-family="Helvetica" font-size="14.5" fill="#444444">Small transformer with a flow-matching</text><text x="630" y="344.6" font-family="Helvetica" font-size="14.5" fill="#444444">action head; an MLP head is the</text><text x="630" y="363.1" font-family="Helvetica" font-size="14.5" fill="#444444">ablation.</text><polyline points="290.0,352.0 318.8,352.0" fill="none" stroke="#BD641B" stroke-width="2"/><polygon points="330.0,352.0 318.8,357.2 318.8,346.8" fill="#BD641B" stroke="none"/><polyline points="580.0,352.0 608.8,352.0" fill="none" stroke="#BD641B" stroke-width="2"/><polygon points="620.0,352.0 608.8,357.2 608.8,346.8" fill="#BD641B" stroke="none"/><rect x="905" y="338" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="946.0" y="353.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><rect x="20" y="420" width="270" height="100" rx="8" fill="#FFFFFF" stroke="#17324A" stroke-width="1.4"/><text x="30" y="444.0" font-family="Helvetica" font-size="15" fill="#444444">Finished episodes, including failed</text><text x="30" y="463.2" font-family="Helvetica" font-size="15" fill="#444444">ones</text><rect x="330" y="420" width="250" height="100" rx="8" fill="#E8EAED" stroke="#17324A" stroke-width="1.4"/><text x="455.0" y="444.4" font-family="Helvetica" font-size="17" font-weight="bold" text-anchor="middle" fill="#17324A">Team signals</text><rect x="620" y="420" width="270" height="100" rx="8" fill="#FFFFFF" stroke="#17324A" stroke-width="1.4"/><text x="630" y="444.0" font-family="Helvetica" font-size="14.5" fill="#444444">Counterfactual Eye credit and</text><text x="630" y="462.6" font-family="Helvetica" font-size="14.5" fill="#444444">hindsight relabeling feed the Eye and</text><text x="630" y="481.1" font-family="Helvetica" font-size="14.5" fill="#444444">Brain data above.</text><polyline points="290.0,470.0 318.8,470.0" fill="none" stroke="#17324A" stroke-width="2"/><polygon points="330.0,470.0 318.8,475.2 318.8,464.8" fill="#17324A" stroke="none"/><polyline points="580.0,470.0 608.8,470.0" fill="none" stroke="#17324A" stroke-width="2"/><polygon points="620.0,470.0 608.8,475.2 608.8,464.8" fill="#17324A" stroke="none"/><rect x="905" y="456" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="946.0" y="471.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><rect x="20" y="542" width="960" height="98.80000000000001" rx="8" fill="#F1EEF5" stroke="#76519A" stroke-width="1.4"/><text x="30" y="566.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#76519A">Brain plan-level reward (weights read from the code)</text><text x="30" y="591.1" font-family="Helvetica" font-size="14.5" fill="#444444">R = 0.1 r_format + 0.2 r_feasible + 0.6 r_rules + 0.1 r_length, optionally + 0.5 r_rollout (closed-loop rollout).</text><text x="30" y="609.7" font-family="Helvetica" font-size="14.5" fill="#444444">r_rules: valid-item fraction from a deterministic dry run, minus 0.25 per violation and per crush, floored at 0. r_length: 1 up to 24 tasks, falling to 0</text><text x="30" y="628.3" font-family="Helvetica" font-size="14.5" fill="#444444">at 48.</text><rect x="20" y="652.8" width="960" height="80.24000000000001" rx="8" fill="#E8EAED" stroke="#17324A" stroke-width="1.4"/><text x="30" y="676.8" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#17324A">Episode score used for credit</text><text x="30" y="701.9" font-family="Helvetica" font-size="14.5" fill="#444444">valid-item fraction - 0.15 per violation - 0.3 per crushed item - 0.01 per replan. Credit C(i, r) = R(real) - R(Eye i replaced by r); oracle gain G =</text><text x="30" y="720.5" font-family="Helvetica" font-size="14.5" fill="#444444">R(oracle) - R(real) = -C(i, oracle).</text><text x="20" y="761.04" font-family="Helvetica" font-size="14" fill="#666666">Formulas are definitions. No trained model has been run with these signals yet, so every outcome is pending.</text></svg>