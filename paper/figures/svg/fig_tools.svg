ext><text x="20" y="150" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">b</text><text x="40" y="150" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">A real flawed draft (seed 12)</text><rect x="20" y="168" width="420" height="26" rx="4" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.0"/><text x="30" y="186" font-family="Courier" font-size="13" fill="#444444">p_laptop1  arm L  deps: g_laptop1</text><rect x="20" y="198" width="420" height="26" rx="4" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.0"/><text x="30" y="216" font-family="Courier" font-size="13" fill="#444444">p_book2  arm R  deps: g_book2, p_laptop1</text><rect x="20" y="228" width="420" height="26" rx="4" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.0"/><text x="30" y="246" font-family="Courier" font-size="13" fill="#444444">p_book1  arm L  deps: g_book1, p_book2</text><rect x="20" y="258" width="420" height="26" rx="4" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.0"/><text x="30" y="276" font-family="Courier" font-size="13" fill="#444444">p_bottle1  arm R  deps: g_bottle1, p_book1</text><rect x="20" y="288" width="420" height="26" rx="4" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.0"/><text x="30" y="306" font-family="Courier" font-size="13" fill="#444444">p_notebook2  arm R  deps: g_notebook2, p_bottle1</text><rect x="20" y="318" width="420" height="26" rx="4" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.0"/><text x="30" y="336" font-family="Courier" font-size="13" fill="#444444">p_notebook1  arm L  deps: g_notebook1, p_notebook2</text><text x="20" y="362" font-family="Helvetica" font-size="14.5" fill="#666666">... 16 tasks; two placements have swapped ordering dependencies.</text><rect x="470" y="168" width="240" height="135.92000000000002" rx="8" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.4"/><text x="480" y="192.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#B5383C">dry_run result</text><text x="480" y="217.1" font-family="Courier" font-size="14.5" fill="#444444">static_ok: true</text><text x="480" y="235.7" font-family="Courier" font-size="14.5" fill="#444444">success: false</text><text x="480" y="254.3" font-family="Courier" font-size="14.5" fill="#444444">violations:</text><text x="480" y="272.8" font-family="Courier" font-size="14.5" fill="#444444">lunchbox_last: lunchbox1</text><text x="480" y="291.4" font-family="Courier" font-size="14.5" fill="#444444">not last</text><rect x="740" y="168" width="240" height="98.80000000000001" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4"/><text x="750" y="192.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#337857">After revising</text><text x="750" y="217.1" font-family="Courier" font-size="14.5" fill="#444444">static_ok: true</text><text x="750" y="235.7" font-family="Courier" font-size="14.5" fill="#444444">success: true</text><text x="750" y="254.3" font-family="Courier" font-size="14.5" fill="#444444">violations: none</text><polyline points="710.0,236.0 725.0,236.0 725.0,217.4 733.3,217.4" fill="none" stroke="#666666" stroke-width="1.2"/><polygon points="740.0,217.4 733.3,220.5 733.3,214.3" fill="#666666" stroke="none"/><text x="20" y="400" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">c</text><text x="40" y="400" font-family="Helvetica" font-size="16" font-weight="bold" fill="#17324A">Verification against a flaky planner</text><text x="110" y="440" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="end" fill="#17324A">none</text><rect x="120" y="424" width="400" height="24" rx="3" fill="#F1F3F5" stroke="#999999" stroke-width="0.8"/><rect x="120" y="424" width="240.0" height="24" rx="3" fill="#739BC6" stroke="#2865A7" stroke-width="1.0"/><text x="530" y="442" font-family="Helvetica" font-size="14" font-weight="bold" fill="#444444">48/80</text><text x="110" y="474" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="end" fill="#17324A">static</text><rect x="120" y="458" width="400" height="24" rx="3" fill="#F1F3F5" stroke="#999999" stroke-width="0.8"/><rect x="120" y="458" width="315.0" height="24" rx="3" fill="#739BC6" stroke="#2865A7" stroke-width="1.0"/><text x="530" y="476" font-family="Helvetica" font-size="14" font-weight="bold" fill="#444444">63/80</text><text x="110" y="508" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="end" fill="#17324A">dry run</text><rect x="120" y="492" width="400" height="24" rx="3" fill="#F1F3F5" stroke="#999999" stroke-width="0.8"/><rect x="120" y="492" width="400.0" height="24" rx="3" fill="#739BC6" stroke="#2865A7" stroke-width="1.0"/><text x="530" y="510" font-family="Helvetica" font-size="14" font-weight="bold" fill="#444444">80/80</text><rect x="660" y="440" width="76.031" height="22.5" rx="4" fill="#F7ECE4" stroke="#BD641B" stroke-width="1.1"/><text x="698.0155" y="455.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#BD641B">FIXTURE</text><text x="660" y="482" font-family="Helvetica" font-size="14.5" fill="#666666">Planner replaced by a wrapper that injects</text><text x="660" y="500" font-family="Helvetica" font-size="14.5" fill="#666666">errors with probability 0.5; clean Eyes; 80 seeds.</text><text x="660" y="518" font-family="Helvetica" font-size="14.5" fill="#666666">Checks the verifier mechanism, not a model.</text></svg>