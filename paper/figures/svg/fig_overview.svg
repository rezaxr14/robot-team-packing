<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#FFFFFF"/><rect x="275" y="26" width="215" height="112" rx="8" fill="#EAF0F6" stroke="#2865A7" stroke-width="1.4"/><text x="285" y="50.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#2865A7">Harness</text><text x="285" y="75.1" font-family="Helvetica" font-size="14.5" fill="#444444">19 markdown files: rules,</text><text x="285" y="93.7" font-family="Helvetica" font-size="14.5" fill="#444444">skills, notes, memory.</text><text x="285" y="112.3" font-family="Helvetica" font-size="14.5" fill="#444444">Two-pass BM25 retrieval.</text><rect x="20" y="176" width="215" height="128" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="30" y="200.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#4A5560">Human</text><text x="30" y="225.1" font-family="Helvetica" font-size="14.5" fill="#444444">Gives the instruction; may</text><text x="30" y="243.7" font-family="Helvetica" font-size="14.5" fill="#444444">AMEND it mid-episode.</text><circle cx="218.0" cy="193.0" r="11" fill="#4A5560"/><text x="218" y="198" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><rect x="275" y="176" width="215" height="128" rx="8" fill="#F1EEF5" stroke="#76519A" stroke-width="1.4"/><text x="285" y="200.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#76519A">Brain</text><text x="285" y="225.1" font-family="Helvetica" font-size="14.5" fill="#444444">Text-only LLM, never sees</text><text x="285" y="243.7" font-family="Helvetica" font-size="14.5" fill="#444444">pixels. Plans a DAG of tasks</text><text x="285" y="262.3" font-family="Helvetica" font-size="14.5" fill="#444444">with tools.</text><circle cx="473.0" cy="193.0" r="11" fill="#76519A"/><text x="473" y="198" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><rect x="530" y="176" width="215" height="128" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4"/><text x="540" y="200.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#337857">Verifier</text><text x="540" y="225.1" font-family="Helvetica" font-size="14.5" fill="#444444">none, static or dry run before</text><text x="540" y="243.7" font-family="Helvetica" font-size="14.5" fill="#444444">any arm moves; reasons fed</text><text x="540" y="262.3" font-family="Helvetica" font-size="14.5" fill="#444444">back, 2 retries.</text><circle cx="728.0" cy="193.0" r="11" fill="#337857"/><text x="728" y="198" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text><rect x="785" y="176" width="215" height="128" rx="8" fill="#EBF2EE" stroke="#337857" stroke-width="1.4"/><text x="795" y="200.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#337857">Scheduler + ladder</text><text x="795" y="225.1" font-family="Helvetica" font-size="14.5" fill="#444444">Head task per arm, bag lock;</text><text x="795" y="243.7" font-family="Helvetica" font-size="14.5" fill="#444444">retry, retreat, reassign, replan,</text><text x="795" y="262.3" font-family="Helvetica" font-size="14.5" fill="#444444">abort.</text><circle cx="983.0" cy="193.0" r="11" fill="#337857"/><text x="983" y="198" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">6</text><rect x="275" y="350" width="215" height="128" rx="8" fill="#E8EAED" stroke="#17324A" stroke-width="1.4"/><text x="285" y="374.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#17324A">Message bus</text><text x="285" y="399.1" font-family="Helvetica" font-size="14.5" fill="#444444">13 typed messages,</text><text x="285" y="417.7" font-family="Helvetica" font-size="14.5" fill="#444444">schema-checked,</text><text x="285" y="436.3" font-family="Helvetica" font-size="14.5" fill="#444444">token-budgeted.</text><circle cx="473.0" cy="367.0" r="11" fill="#17324A"/><text x="473" y="372" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><rect x="785" y="350" width="215" height="128" rx="8" fill="#F8F0E8" stroke="#BD641B" stroke-width="1.4"/><text x="795" y="374.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#BD641B">Arm L, Arm R</text><text x="795" y="399.1" font-family="Helvetica" font-size="14.5" fill="#444444">Blind: force and</text><text x="795" y="417.7" font-family="Helvetica" font-size="14.5" fill="#444444">proprioception only. Report</text><text x="795" y="436.3" font-family="Helvetica" font-size="14.5" fill="#444444">TOUCH; CHALLENGE the</text><text x="795" y="454.8" font-family="Helvetica" font-size="14.5" fill="#444444">Eye.</text><circle cx="983.0" cy="367.0" r="11" fill="#BD641B"/><text x="983" y="372" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">7</text><rect x="275" y="524" width="215" height="128" rx="8" fill="#E6F2F3" stroke="#087F83" stroke-width="1.4"/><text x="285" y="548.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#087F83">Eye A, Eye B</text><text x="285" y="573.1" font-family="Helvetica" font-size="14.5" fill="#444444">VLMs, the only agents with</text><text x="285" y="591.7" font-family="Helvetica" font-size="14.5" fill="#444444">pixels. Emit SCENE JSON.</text><circle cx="473.0" cy="541.0" r="11" fill="#087F83"/><text x="473" y="546" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><rect x="530" y="524" width="215" height="104" rx="8" fill="#EAF0F6" stroke="#2865A7" stroke-width="1.4" stroke-dasharray="6 4"/><text x="540" y="548.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#2865A7">Probe (optional)</text><text x="540" y="573.1" font-family="Helvetica" font-size="14.5" fill="#444444">Arms weigh every item first;</text><text x="540" y="591.7" font-family="Helvetica" font-size="14.5" fill="#444444">measured mass overrides</text><text x="540" y="610.3" font-family="Helvetica" font-size="14.5" fill="#444444">Eye guesses.</text><rect x="785" y="524" width="215" height="128" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="795" y="548.0" font-family="Helvetica" font-size="16.5" font-weight="bold" fill="#4A5560">World</text><text x="795" y="573.1" font-family="Helvetica" font-size="14.5" fill="#444444">Symbolic, pose-level or Isaac</text><text x="795" y="591.7" font-family="Helvetica" font-size="14.5" fill="#444444">Lab; one checker.</text><polyline points="382.5,138.0 382.5,164.8" fill="none" stroke="#2865A7" stroke-width="2"/><polygon points="382.5,176.0 377.3,164.8 387.7,164.8" fill="#2865A7" stroke="none"/><polyline points="235.0,240.0 263.8,240.0" fill="none" stroke="#4A5560" stroke-width="2"/><polygon points="275.0,240.0 263.8,245.2 263.8,234.8" fill="#4A5560" stroke="none"/><polyline points="490.0,240.0 518.8,240.0" fill="none" stroke="#76519A" stroke-width="2"/><polygon points="530.0,240.0 518.8,245.2 518.8,234.8" fill="#76519A" stroke="none"/><polyline points="745.0,240.0 773.8,240.0" fill="none" stroke="#337857" stroke-width="2"/><polygon points="785.0,240.0 773.8,245.2 773.8,234.8" fill="#337857" stroke="none"/><polyline points="127.5,304.0 127.5,414.0 263.8,414.0" fill="none" stroke="#4A5560" stroke-width="2"/><polygon points="275.0,414.0 263.8,419.2 263.8,408.8" fill="#4A5560" stroke="none"/><polyline points="382.5,350.0 382.5,315.2" fill="none" stroke="#17324A" stroke-width="2"/><polygon points="382.5,304.0 387.7,315.2 377.3,315.2" fill="#17324A" stroke="none"/><polyline points="892.5,304.0 892.5,338.8" fill="none" stroke="#337857" stroke-width="2"/><polygon points="892.5,350.0 887.3,338.8 897.7,338.8" fill="#337857" stroke="none"/><polyline points="785.0,414.0 501.2,414.0" fill="none" stroke="#BD641B" stroke-width="2"/><polygon points="490.0,414.0 501.2,408.8 501.2,419.2" fill="#BD641B" stroke="none"/><polyline points="892.5,478.0 892.5,512.8" fill="none" stroke="#BD641B" stroke-width="2"/><polygon points="892.5,524.0 887.3,512.8 897.7,512.8" fill="#BD641B" stroke="none"/><polyline points="785.0,634.0 501.2,634.0" fill="none" stroke="#4A5560" stroke-width="2"/><polygon points="490.0,634.0 501.2,628.8 501.2,639.2" fill="#4A5560" stroke="none"/><polyline points="382.5,524.0 382.5,489.2" fill="none" stroke="#087F83" stroke-width="2"/><polygon points="382.5,478.0 387.7,489.2 377.3,489.2" fill="#087F83" stroke="none"/><text x="660" y="406" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#BD641B">TOUCH, CHALLENGE</text><text x="64" y="400" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">AMEND</text><text x="434.5" y="502" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#087F83">SCENE</text><text x="434.5" y="330" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#17324A">reports</text><text x="660" y="662" font-family="Helvetica" font-size="14.5" text-anchor="middle" fill="#4A5560">images</text><rect x="20" y="686" width="147.73350000000002" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="93.86675000000001" y="701.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">Eye LoRA: pending</text><rect x="195" y="686" width="159.0" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="274.5" y="701.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">Brain LoRA: pending</text><rect x="380" y="686" width="154.186" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="457.093" y="701.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">Arm policy: pending</text><text x="20" y="738" font-family="Helvetica" font-size="14" fill="#666666">Numbers give the order of one episode. Teal Eye, purple Brain, orange Arm; dashed = optional; red = no trained model yet.</text></svg>