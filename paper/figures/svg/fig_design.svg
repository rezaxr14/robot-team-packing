<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="698" viewBox="0 0 1000 698"><rect width="1000" height="698" fill="#FFFFFF"/><text x="20" y="28" font-family="Helvetica" font-size="17" font-weight="bold" fill="#17324A">Five questions, the experiment that answers each, and where it is reported</text><text x="20" y="56" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#666666">Question</text><text x="345" y="56" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#666666">Experiment</text><text x="665" y="56" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#666666">Evidence class</text><text x="815" y="56" font-family="Helvetica" font-size="14.5" font-weight="bold" fill="#666666">Reported in</text><rect x="20" y="66" width="300" height="104" rx="8" fill="#FFFFFF" stroke="#2865A7" stroke-width="1.4"/><text x="30" y="90.0" font-family="Helvetica" font-size="14.5" fill="#444444">Does the upstream level-2 scorer's random</text><text x="30" y="108.6" font-family="Helvetica" font-size="14.5" fill="#444444">start position change scores?</text><rect x="345" y="66" width="295" height="104" rx="8" fill="#FFFFFF" stroke="#2865A7" stroke-width="1.4"/><text x="355" y="90.0" font-family="Helvetica" font-size="14.5" fill="#444444">Inventory the released data; rescore</text><text x="355" y="108.6" font-family="Helvetica" font-size="14.5" fill="#444444">released checkpoints with a seeded and</text><text x="355" y="127.1" font-family="Helvetica" font-size="14.5" fill="#444444">an exhaustive scorer.</text><rect x="665" y="66" width="130" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="730.0" y="88.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">TRACK A</text><rect x="815" y="66" width="165" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="897.5" y="88.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">Fig. scorer</text><polyline points="320.0,118.0 333.8,118.0" fill="none" stroke="#2865A7" stroke-width="2"/><polygon points="345.0,118.0 333.8,123.2 333.8,112.8" fill="#2865A7" stroke="none"/><polyline points="640.0,118.0 653.8,118.0" fill="none" stroke="#2865A7" stroke-width="2"/><polygon points="665.0,118.0 653.8,123.2 653.8,112.8" fill="#2865A7" stroke="none"/><rect x="823" y="136" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="864.0" y="151.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><rect x="20" y="186" width="300" height="104" rx="8" fill="#FFFFFF" stroke="#2865A7" stroke-width="1.4"/><text x="30" y="210.0" font-family="Helvetica" font-size="14.5" fill="#444444">How much of a level-1 error is perception</text><text x="30" y="228.6" font-family="Helvetica" font-size="14.5" fill="#444444">rather than reasoning?</text><rect x="345" y="186" width="295" height="104" rx="8" fill="#FFFFFF" stroke="#2865A7" stroke-width="1.4"/><text x="355" y="210.0" font-family="Helvetica" font-size="14.5" fill="#444444">Same text-only Brain given oracle</text><text x="355" y="228.6" font-family="Helvetica" font-size="14.5" fill="#444444">descriptions, no description, or a real Eye</text><text x="355" y="247.1" font-family="Helvetica" font-size="14.5" fill="#444444">description.</text><rect x="665" y="186" width="130" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="730.0" y="208.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">TRACK A</text><rect x="815" y="186" width="165" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="897.5" y="208.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">Table Track A</text><polyline points="320.0,238.0 333.8,238.0" fill="none" stroke="#2865A7" stroke-width="2"/><polygon points="345.0,238.0 333.8,243.2 333.8,232.8" fill="#2865A7" stroke="none"/><polyline points="640.0,238.0 653.8,238.0" fill="none" stroke="#2865A7" stroke-width="2"/><polygon points="665.0,238.0 653.8,243.2 653.8,232.8" fill="#2865A7" stroke="none"/><rect x="823" y="256" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="864.0" y="271.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><rect x="20" y="306" width="300" height="104" rx="8" fill="#FFFFFF" stroke="#76519A" stroke-width="1.4"/><text x="30" y="330.0" font-family="Helvetica" font-size="14.5" fill="#444444">Do tools, verification and the harness help</text><text x="30" y="348.6" font-family="Helvetica" font-size="14.5" fill="#444444">the team, and which part matters?</text><rect x="345" y="306" width="295" height="104" rx="8" fill="#FFFFFF" stroke="#76519A" stroke-width="1.4"/><text x="355" y="330.0" font-family="Helvetica" font-size="14.5" fill="#444444">Full system against single-factor ablations:</text><text x="355" y="348.6" font-family="Helvetica" font-size="14.5" fill="#444444">harness, verification, challenge, probe,</text><text x="355" y="367.1" font-family="Helvetica" font-size="14.5" fill="#444444">one Eye, communication mode.</text><rect x="665" y="306" width="130" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="730.0" y="328.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">LLM-SYMBOLIC,</text><text x="730.0" y="346.9" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">ISAAC</text><rect x="815" y="306" width="165" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="897.5" y="328.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">Tables main,</text><text x="897.5" y="346.9" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">ablations</text><polyline points="320.0,358.0 333.8,358.0" fill="none" stroke="#76519A" stroke-width="2"/><polygon points="345.0,358.0 333.8,363.2 333.8,352.8" fill="#76519A" stroke="none"/><polyline points="640.0,358.0 653.8,358.0" fill="none" stroke="#76519A" stroke-width="2"/><polygon points="665.0,358.0 653.8,363.2 653.8,352.8" fill="#76519A" stroke="none"/><rect x="823" y="376" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="864.0" y="391.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><rect x="20" y="426" width="300" height="104" rx="8" fill="#FFFFFF" stroke="#BD641B" stroke-width="1.4"/><text x="30" y="450.0" font-family="Helvetica" font-size="14.5" fill="#444444">How far does plan validity overstate</text><text x="30" y="468.6" font-family="Helvetica" font-size="14.5" fill="#444444">physical success, and who is blamed?</text><rect x="345" y="426" width="295" height="104" rx="8" fill="#FFFFFF" stroke="#BD641B" stroke-width="1.4"/><text x="355" y="450.0" font-family="Helvetica" font-size="14.5" fill="#444444">Plan pass against physical success, split</text><text x="355" y="468.6" font-family="Helvetica" font-size="14.5" fill="#444444">by the agent the loop charges; attribution</text><text x="355" y="487.1" font-family="Helvetica" font-size="14.5" fill="#444444">checked by hand labels.</text><rect x="665" y="426" width="130" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="730.0" y="448.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">ISAAC</text><rect x="815" y="426" width="165" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="897.5" y="448.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">Fig. results, Table</text><text x="897.5" y="466.9" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">attribution</text><polyline points="320.0,478.0 333.8,478.0" fill="none" stroke="#BD641B" stroke-width="2"/><polygon points="345.0,478.0 333.8,483.2 333.8,472.8" fill="#BD641B" stroke="none"/><polyline points="640.0,478.0 653.8,478.0" fill="none" stroke="#BD641B" stroke-width="2"/><polygon points="665.0,478.0 653.8,483.2 653.8,472.8" fill="#BD641B" stroke="none"/><rect x="823" y="496" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="864.0" y="511.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><rect x="20" y="546" width="300" height="104" rx="8" fill="#FFFFFF" stroke="#087F83" stroke-width="1.4"/><text x="30" y="570.0" font-family="Helvetica" font-size="14.5" fill="#444444">Do counterfactual credit and hindsight</text><text x="30" y="588.6" font-family="Helvetica" font-size="14.5" fill="#444444">relabeling improve training?</text><rect x="345" y="546" width="295" height="104" rx="8" fill="#FFFFFF" stroke="#087F83" stroke-width="1.4"/><text x="355" y="570.0" font-family="Helvetica" font-size="14.5" fill="#444444">Credit-guided rejection sampling against</text><text x="355" y="588.6" font-family="Helvetica" font-size="14.5" fill="#444444">plain SFT; Brain data with and without</text><text x="355" y="607.1" font-family="Helvetica" font-size="14.5" fill="#444444">relabeled records at fixed size.</text><rect x="665" y="546" width="130" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="730.0" y="568.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">LLM-SYMBOLIC,</text><text x="730.0" y="586.9" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">ISAAC</text><rect x="815" y="546" width="165" height="104" rx="8" fill="#F1F3F5" stroke="#4A5560" stroke-width="1.4"/><text x="897.5" y="568.3" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#4A5560">Table credit</text><polyline points="320.0,598.0 333.8,598.0" fill="none" stroke="#087F83" stroke-width="2"/><polygon points="345.0,598.0 333.8,603.2 333.8,592.8" fill="#087F83" stroke="none"/><polyline points="640.0,598.0 653.8,598.0" fill="none" stroke="#087F83" stroke-width="2"/><polygon points="665.0,598.0 653.8,603.2 653.8,592.8" fill="#087F83" stroke="none"/><rect x="823" y="616" width="82" height="22.5" rx="4" fill="#F8EBEC" stroke="#B5383C" stroke-width="1.1"/><text x="864.0" y="631.5" font-family="Helvetica" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#B5383C">pending</text><text x="20" y="680" font-family="Helvetica" font-size="14" fill="#666666">Every outcome is pending. Evidence classes are never pooled; fixture runs are kept out of this design (appendix F). Evaluation seeds are below 100000.</text></svg>